# Copy to .github/workflows/ci.yml once the GitHub token has `workflow` scope.
name: ci
on:
  push:
  pull_request:
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Isolation check (harness must not read SUT prompts)
        run: |
          if grep -R "sut.agent.prompts" harness -n; then
            echo "Harness must not read SUT prompts" >&2
            exit 1
          fi
      - name: Holdout gate
        run: ticketbench-run holdout --out harness/report/holdout_ci.json
      - name: Upload holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdout-report
          path: harness/report/holdout_ci.json
